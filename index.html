<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0c29">
    <meta name="screen-orientation" content="portrait">
    <meta name="x5-orientation" content="portrait">
    <meta name="full-screen" content="yes">
    <title>星际穿越 - 竖屏版</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none; /* 禁止默认触摸行为，防止滚动 */
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0c29;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #fff;
            position: fixed; /* iOS 防止橡皮筋滚动 */
        }

        /* 游戏容器：竖屏全屏 */
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* 动态视口高度，兼容移动端地址栏 */
            overflow: hidden;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI 层 */
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-weight: bold;
        }

        .score-board {
            font-size: 22px;
            text-shadow: 0 0 8px #00ffff;
        }

        .score-board .num {
            color: #00ffff;
        }

        .best-board {
            font-size: 13px;
            color: #aaa;
            font-weight: normal;
            text-align: right;
        }

        /* 横屏提示遮罩（竖屏游戏检测到横屏时显示） */
        #landscapeWarning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: none; /* 默认隐藏，JS 控制显示 */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
        }

        #landscapeWarning h2 {
            color: #00ffff;
            margin-bottom: 14px;
            font-size: 22px;
        }

        #landscapeWarning p {
            color: #ccc;
            font-size: 15px;
        }

        #landscapeWarning .icon {
            font-size: 52px;
            margin-bottom: 20px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        /* 开始 / 结束 屏幕 */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            z-index: 10;
            text-align: center;
            padding: 24px;
        }

        .hidden {
            display: none !important;
        }

        .screen h1 {
            color: #00ffff;
            letter-spacing: 4px;
            margin-bottom: 16px;
            font-size: 34px;
            text-shadow: 0 0 14px #00ffff;
        }

        .screen h1.over {
            color: #ff4444;
            text-shadow: 0 0 14px #ff4444;
        }

        .screen .tip {
            color: #bbb;
            font-size: 15px;
            line-height: 1.9;
            margin-bottom: 28px;
        }

        .screen .final {
            color: #fff;
            font-size: 17px;
            margin-bottom: 26px;
        }

        .screen .final b {
            color: #00ffff;
            font-size: 30px;
            margin-left: 6px;
            text-shadow: 0 0 10px #00ffff;
        }

        button {
            background: linear-gradient(45deg, #ff00cc, #333399);
            border: none;
            padding: 16px 0;
            width: 68%;
            max-width: 300px;
            color: #fff;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 32px;
            box-shadow: 0 6px 20px rgba(255, 0, 204, 0.45);
            transition: transform 0.15s;
            -webkit-appearance: none;
            appearance: none;
        }

        button:active {
            transform: scale(0.95);
        }

        /* 底部操作提示 */
        .hint-bottom {
            align-self: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- 横屏强制提示 -->
    <div id="landscapeWarning">
        <div class="icon">📱</div>
        <h2>请旋转至竖屏</h2>
        <p>本游戏为竖屏体验，请竖着握持手机</p>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- UI 层 -->
        <div id="uiLayer">
            <div class="top-bar">
                <div class="score-board">得分 <span class="num" id="scoreDisplay">0</span></div>
                <div class="best-board">最高分<br><span id="highScoreDisplay">0</span></div>
            </div>
            <div class="hint-bottom">按住屏幕拖动飞船</div>
        </div>

        <!-- 开始屏幕 -->
        <div id="startScreen" class="screen">
            <h1>星际穿越</h1>
            <p class="tip">按住屏幕拖动飞船<br>躲避陨石，收集绿色能量球</p>
            <button id="startBtn">开始游戏</button>
        </div>

        <!-- 结束屏幕 -->
        <div id="gameOverScreen" class="screen hidden">
            <h1 class="over">游戏结束</h1>
            <p class="final">最终得分<b id="finalScore">0</b></p>
            <button id="restartBtn">再玩一次</button>
        </div>
    </div>

<script>
    /**
     * 竖屏版《星际穿越》
     * 玩家在竖屏底部附近活动，按住屏幕拖动控制飞船。
     */
    const config = {
        playerSpeed: 0.18,             // 玩家跟随手指的平滑系数
        followOffsetY: -60,            // 手指与飞船的竖直偏移，避免手指挡住飞船
        obstacleSpeedBase: 3.2,
        obstacleSpawnRate: 52,         // 生成陨石的帧间隔
        minSpawnRate: 22,
        powerUpChance: 0.35,
        colors: {
            player: '#00ffff',
            obstacle: '#ff4444',
            powerUp: '#44ff44',
            star: '#ffffff'
        }
    };

    const state = {
        isPlaying: false,
        score: 0,
        highScore: Number(localStorage.getItem('starTrekPortraitHighScore')) || 0,
        frames: 0,
        width: 0,
        height: 0,
        isLandscape: false,
        lastTime: 0
    };

    // DOM 元素
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('gameContainer');
    const scoreEl = document.getElementById('scoreDisplay');
    const highScoreEl = document.getElementById('highScoreDisplay');
    const finalScoreEl = document.getElementById('finalScore');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const landscapeWarning = document.getElementById('landscapeWarning');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    // 游戏实体
    let player = null;
    let obstacles = [];
    let particles = [];
    let powerUps = [];
    let stars = [];

    const dpr = Math.min(window.devicePixelRatio || 1, 3);

    /* ---------------- 实体类 ---------------- */

    class Player {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = Math.max(13, Math.min(state.width, state.height) * 0.028);
            this.targetX = x;
            this.targetY = y;
        }

        update() {
            this.x += (this.targetX - this.x) * config.playerSpeed;
            this.y += (this.targetY - this.y) * config.playerSpeed;

            // 边界限制
            const r = this.radius;
            if (this.x < r) this.x = r;
            if (this.x > state.width - r) this.x = state.width - r;
            if (this.y < r) this.y = r;
            if (this.y > state.height - r) this.y = state.height - r;
        }

        draw() {
            // 光晕
            const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 2.4);
            glow.addColorStop(0, 'rgba(0,255,255,0.55)');
            glow.addColorStop(1, 'rgba(0,255,255,0)');
            ctx.beginPath();
            ctx.fillStyle = glow;
            ctx.arc(this.x, this.y, this.radius * 2.4, 0, Math.PI * 2);
            ctx.fill();

            // 船体
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = config.colors.player;
            ctx.fill();

            // 核心
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 0.48, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fill();
        }
    }

    class Obstacle {
        constructor() {
            this.radius = Math.random() * (state.width * 0.045) + state.width * 0.035;
            this.x = Math.random() * (state.width - this.radius * 2) + this.radius;
            this.y = -this.radius;
            this.speed = config.obstacleSpeedBase + Math.random() * 1.8 + (state.score * 0.012);
            this.rotation = Math.random() * Math.PI;
            this.rotationSpeed = (Math.random() - 0.5) * 0.08;
            // 预生成不规则顶点，避免逐帧抖动
            this.verts = [];
            const sides = 6;
            for (let i = 0; i < sides; i++) {
                this.verts.push({
                    angle: (i / sides) * Math.PI * 2,
                    r: this.radius * (0.8 + Math.random() * 0.4)
                });
            }
        }

        update() {
            this.y += this.speed;
            this.rotation += this.rotationSpeed;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);

            ctx.beginPath();
            this.verts.forEach((v, i) => {
                const px = Math.cos(v.angle) * v.r;
                const py = Math.sin(v.angle) * v.r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            });
            ctx.closePath();
            ctx.fillStyle = config.colors.obstacle;
            ctx.shadowBlur = 12;
            ctx.shadowColor = config.colors.obstacle;
            ctx.fill();
            ctx.shadowBlur = 0;

            // 内部高光
            ctx.beginPath();
            ctx.arc(-this.radius * 0.25, -this.radius * 0.25, this.radius * 0.22, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fill();

            ctx.restore();
        }
    }

    class PowerUp {
        constructor() {
            this.radius = Math.max(9, state.width * 0.022);
            this.x = Math.random() * (state.width - this.radius * 2) + this.radius;
            this.y = -this.radius;
            this.speed = 2.6;
            this.pulse = 0;
        }

        update() {
            this.y += this.speed;
            this.pulse += 0.12;
        }

        draw() {
            const scale = 1 + Math.sin(this.pulse) * 0.22;
            ctx.save();
            ctx.shadowBlur = 14;
            ctx.shadowColor = config.colors.powerUp;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * scale, 0, Math.PI * 2);
            ctx.fillStyle = config.colors.powerUp;
            ctx.fill();
            ctx.restore();

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fill();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 0.5) * 6;
            this.life = 1.0;
            this.color = color;
            this.size = Math.random() * 3 + 1;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vx *= 0.97;
            this.vy *= 0.97;
            this.life -= 0.025;
        }

        draw() {
            ctx.globalAlpha = Math.max(this.life, 0);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1;
        }
    }

    class Star {
        constructor() {
            this.reset(true);
        }

        reset(init) {
            this.x = Math.random() * state.width;
            this.y = init ? Math.random() * state.height : -2;
            this.size = Math.random() * 1.8 + 0.4;
            this.alpha = Math.random() * 0.5 + 0.3;
            this.speed = Math.random() * 0.6 + 0.15;
        }

        update() {
            this.y += this.speed + (state.isPlaying ? state.score * 0.0008 : 0);
            if (this.y > state.height) this.reset(false);
        }

        draw() {
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = config.colors.star;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1;
        }
    }

    /* ---------------- 初始化与适配 ---------------- */

    function init() {
        checkOrientation();
        resize();

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);

        canvas.addEventListener('touchstart', handleTouch, { passive: false });
        canvas.addEventListener('touchmove', handleTouch, { passive: false });
        canvas.addEventListener('mousedown', handleMouse);
        canvas.addEventListener('mousemove', handleMouse);

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        highScoreEl.textContent = state.highScore;

        for (let i = 0; i < 60; i++) stars.push(new Star());

        requestAnimationFrame(gameLoop);
    }

    function handleResize() {
        clearTimeout(window.__resizeTimer);
        window.__resizeTimer = setTimeout(() => {
            checkOrientation();
            if (!state.isLandscape) {
                resize();
                rebuildStars();
            }
        }, 120);
    }

    function checkOrientation() {
        // 横屏 -> 提示用户转回竖屏
        const landscape = window.innerWidth > window.innerHeight;
        state.isLandscape = landscape;
        landscapeWarning.style.display = landscape ? 'flex' : 'none';
    }

    function resize() {
        state.width = container.clientWidth;
        state.height = container.clientHeight;

        canvas.width = Math.round(state.width * dpr);
        canvas.height = Math.round(state.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (player) {
            player.x = Math.min(player.x, state.width - player.radius);
            player.y = Math.min(player.y, state.height - player.radius);
            player.targetX = player.x;
            player.targetY = player.y;
        }
    }

    function rebuildStars() {
        stars = [];
        for (let i = 0; i < 60; i++) stars.push(new Star());
    }

    /* ---------------- 输入处理 ---------------- */

    function getPos(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function movePlayerTo(x, y) {
        if (!player) return;
        player.targetX = x;
        player.targetY = y + config.followOffsetY;
    }

    function handleTouch(e) {
        if (!state.isPlaying || state.isLandscape) return;
        e.preventDefault();
        const touch = e.touches[0];
        if (!touch) return;
        const p = getPos(touch.clientX, touch.clientY);
        movePlayerTo(p.x, p.y);
    }

    function handleMouse(e) {
        if (!state.isPlaying || state.isLandscape) return;
        if (e.buttons === 0 && e.type === 'mousemove') return; // 鼠标需按住
        const p = getPos(e.clientX, e.clientY);
        movePlayerTo(p.x, p.y);
    }

    /* ---------------- 游戏流程 ---------------- */

    function startGame() {
        if (state.isLandscape) return;

        state.isPlaying = true;
        state.score = 0;
        state.frames = 0;
        state.lastTime = performance.now();
        config.obstacleSpawnRate = 52;
        scoreEl.textContent = '0';
        gameOverScreen.classList.add('hidden');
        startScreen.classList.add('hidden');

        obstacles = [];
        particles = [];
        powerUps = [];

        player = new Player(state.width / 2, state.height * 0.72);
        player.targetX = player.x;
        player.targetY = player.y;
    }

    function gameOver() {
        state.isPlaying = false;

        if (state.score > state.highScore) {
            state.highScore = state.score;
            localStorage.setItem('starTrekPortraitHighScore', state.highScore);
            highScoreEl.textContent = state.highScore;
        }

        finalScoreEl.textContent = state.score;
        gameOverScreen.classList.remove('hidden');
    }

    function createExplosion(x, y, color, count) {
        for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
    }

    function checkCollision(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        return dist < a.radius + b.radius;
    }

    /* ---------------- 主循环 ---------------- */

    function gameLoop(now) {
        requestAnimationFrame(gameLoop);

        if (state.isLandscape) return;

        ctx.clearRect(0, 0, state.width, state.height);

        // 背景星星
        stars.forEach(s => { s.update(); s.draw(); });

        if (state.isPlaying) {
            state.frames++;

            // 生成陨石
            if (state.frames % config.obstacleSpawnRate === 0) {
                obstacles.push(new Obstacle());
                if (config.obstacleSpawnRate > config.minSpawnRate && state.score > 0 && state.score % 100 === 0) {
                    config.obstacleSpawnRate -= 2;
                }
            }

            // 生成能量球
            if (state.frames % 160 === 0 && Math.random() < config.powerUpChance) {
                powerUps.push(new PowerUp());
            }

            // 玩家
            player.update();
            player.draw();

            // 陨石
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.update();
                obs.draw();

                if (checkCollision(player, obs)) {
                    createExplosion(player.x, player.y, config.colors.player, 26);
                    player = null;
                    gameOver();
                    break;
                }

                if (obs.y - obs.radius > state.height) {
                    obstacles.splice(i, 1);
                    state.score += 10;
                    scoreEl.textContent = state.score;
                }
            }

            // 能量球（玩家可能已在碰撞中置空）
            if (player) {
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const pup = powerUps[i];
                    pup.update();
                    pup.draw();

                    if (checkCollision(player, pup)) {
                        state.score += 50;
                        scoreEl.textContent = state.score;
                        createExplosion(pup.x, pup.y, config.colors.powerUp, 16);
                        powerUps.splice(i, 1);
                    } else if (pup.y - pup.radius > state.height) {
                        powerUps.splice(i, 1);
                    }
                }
            } else {
                powerUps = [];
            }
        }

        // 粒子（结算后继续播放完毕）
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    // 启动
    init();
</script>
</body>
</html>
